[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepdeck-agent-examples"
version = "0.1.0"
description = "Trainable and rule-based example agents for Deep Deck League"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deep Deck League" }]
dependencies = [
  "deepdeck-agent-sdk>=0.1.0",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
deep-learning = [
  "torch>=2.4,<3",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
deepdeck-example = "deepdeck_examples.run:main"
deepdeck-train = "deepdeck_examples.deep_learning.training:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepdeck_examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["deepdeck_examples"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
follow_imports = "skip"
