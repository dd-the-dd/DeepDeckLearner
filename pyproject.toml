[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepdeck-learner"
version = "0.3.4"
description = "Play Magic, build decks, and personalize programmatic Deep Deck League agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deep Deck League" }]
dependencies = [
  "deepdeck-agent-sdk>=0.2.1,<0.3",
  "fastapi>=0.146,<0.147",
  "httpx>=0.28,<0.29",
  "mcp>=2.3,<3",
  "openai-agents>=0.24,<0.25",
  "PyJWT[crypto]>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "psutil>=6,<8",
  "networkx>=3.4,<4",
  "uvicorn>=0.35,<0.36",
]

[project.optional-dependencies]
desktop = ["pywebview>=6,<7", "tzdata>=2025.2"]
desktop-build = ["pyinstaller>=6.16,<7"]
deep-learning = [
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "torch>=2.4,<2.9; sys_platform == 'win32'",
  "torch>=2.4,<3; sys_platform != 'win32'",
  "websockets>=15,<18",
]
dev = [
  "hatchling>=1.27",
  "httpx>=0.28,<0.29",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
  "types-psutil>=7,<8",
  "types-PyYAML>=6,<7",
]

[project.scripts]
deepdeck-example = "deepdeck_examples.run:main"
deepdeck-train = "deepdeck_examples.deep_learning.training:main"
deepdeck-learner = "deepdeck_learner.cli:main"
deepdeck-desktop = "deepdeck_learner.desktop:main"
oracle-ai-train = "oracle_ai.training.cli:main"
oracle-ai-league-train = "oracle_ai.training.league:main"
oracle-ai-ground-truth-eval = "oracle_ai.ground_truth_cli:main"
oracle-ai-calibrate-anchors = "oracle_ai.training.anchor_calibration:main"
oracle-ai-v12-clients = "oracle_ai.agents.v12_clients:main"
oracle-ai-v13-world-model = "oracle_ai.training.world_model:main"
oracle-ai-v15-world-model = "oracle_ai.training.world_model_v15:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepdeck_examples", "src/deepdeck_learner", "src/oracle_ai"]

[tool.hatch.build.targets.wheel.force-include]
"configs/oracle-ai" = "oracle_ai/configs"

[tool.hatch.build.hooks.custom]
path = "packaging/web_build_hook.py"

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "configs", "packaging", "scripts", "tests", "LICENSE",
  "apps/learner-web/src", "apps/learner-web/public",
  "apps/learner-web/index.html", "apps/learner-web/package.json",
  "apps/learner-web/package-lock.json", "apps/learner-web/vite.config.ts",
  "apps/learner-web/tsconfig.json", "apps/learner-web/tsconfig.app.json",
  "apps/learner-web/tsconfig.node.json", "apps/learner-web/eslint.config.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Ruff's formatter governs code wrapping. Embedded SQL/JS, prompts and fixture
# literals must retain their exact values; it intentionally leaves them long.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/oracle_ai/**/*.py" = ["B023", "B905", "E501", "SIM905"]
"tests/oracle_ai/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["deepdeck_examples", "deepdeck_learner"]

[[tool.mypy.overrides]]
# Optional training libraries ship version-specific stubs. Keep their internals
# outside this Python 3.10 application check (NumPy now uses Python 3.12 syntax).
module = ["torch", "torch.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
