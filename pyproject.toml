[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepdeck-learner"
version = "0.2.0"
description = "Train, inspect, and locally playtest public Deep Deck AI examples"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deep Deck League" }]
dependencies = [
  "deepdeck-agent-sdk>=0.1.0",
  "fastapi>=0.116,<0.117",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.35,<0.36",
]

[project.optional-dependencies]
deep-learning = [
  "torch>=2.4,<3",
]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
deepdeck-example = "deepdeck_examples.run:main"
deepdeck-train = "deepdeck_examples.deep_learning.training:main"
deepdeck-learner = "deepdeck_learner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepdeck_examples", "src/deepdeck_learner"]

[tool.hatch.build.targets.wheel.force-include]
"apps/learner-web/dist" = "deepdeck_learner/web"

[tool.hatch.build.targets.sdist.force-include]
"apps/learner-web/dist" = "apps/learner-web/dist"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["deepdeck_examples", "deepdeck_learner"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
follow_imports = "skip"
