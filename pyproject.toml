[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepdeck-agent-examples"
version = "0.1.0"
description = "Random and Alexios rule-based agents for Deep Deck League"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deep Deck League" }]
dependencies = ["deepdeck-agent-sdk>=0.1.0"]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
deepdeck-example = "deepdeck_examples.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepdeck_examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["deepdeck_examples"]

