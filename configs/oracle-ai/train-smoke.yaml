seed: 7
device: cpu
outputDir: runs/oracle-ai-smoke
episodes: 2
checkpointEvery: 1
maxStateTokens: 32
smokeHorizon: 4

model:
  feature_dim: 32
  d_model: 32
  layers: 1
  heads: 4
  feedforward_dim: 64
  dropout: 0.0

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  learning_rate: 0.0003
  epochs: 1
  max_grad_norm: 1.0
