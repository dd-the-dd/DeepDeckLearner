name: Release DeepDeckLearner

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
          cache-dependency-path: apps/learner-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and verify distributions
        run: |
          npm ci --prefix apps/learner-web
          npm run build --prefix apps/learner-web
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m venv "$RUNNER_TEMP/player-venv"
          "$RUNNER_TEMP/player-venv/bin/python" -m pip install ./external/deepdeck-agent dist/*.whl
          "$RUNNER_TEMP/player-venv/bin/python" scripts/verify_player_installation.py
      - uses: actions/upload-artifact@v4
        with:
          name: deepdeck-learner-distributions
          path: dist/
          if-no-files-found: error
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
