name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: git clone --depth 1 https://github.com/dd-the-dd/deepdeck-agent-sdk ../deepdeck-agent-sdk
      - run: python -m pip install -e "../deepdeck-agent-sdk[dev]"
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: ruff check .
      - run: mypy
      - run: pytest

