name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: git clone --depth 1 https://github.com/dd-the-dd/DeepDeckAgent ../DeepDeckAgent
      - run: python -m pip install -e "../DeepDeckAgent[dev]"
      - run: python -m pip install "torch>=2.4,<3"
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: ruff check .
      - run: mypy
      - run: pytest

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
